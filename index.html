<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/global.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Portfólio</title>
</head>



<body class="bg-gradient-to-br from-[#020617] via-[#0f172a] to-black flex items-center justify-center min-h-screen">

    <div
        class="flex flex-col bg-transparent border rounded-[1rem] border-white text-white m-4 md:m-20 p-8 items-center gap-7 max-w-[calc(100vw-2rem)] md:max-w-none">


        <img src="assets/img/points.png" alt="" class="self-end max-h-2">

        <header class="flex flex-col md:flex-row gap-[1rem] items-center md:items-start">

            <img src="" id="profile-photo" alt="" class="w-32 h-32  md:w-48 md:h-48 rounded-full">

            <div class="flex flex-col justify-center item-start">
                <h1 class="text-3xl w-1/2 mb-3 font-semibold self-center md:self-start" id="profile-name"></h1>
                <div class="flex items-center gap-2">
                    <img class="max-h-3 w-5 object-contain" src="assets/img/local.png" alt="">
                    <p id="job"></p>
                </div>
                <div class="flex items-center gap-2">
                    <img class="max-h-3 w-5 object-contain" src="assets/img/local.png" alt="">
                    <p id="location"></p>
                </div>
                <div class="flex items-center gap-2">
                    <img class="max-h-3 w-5 object-contain" src="assets/img/wpp.png" alt="">
                    <p id="number"></p>
                </div>
                <div class="flex items-center gap-2">
                    <img class="max-h-3 w-5 object-contain" src="assets/img/mail.png" alt="">
                    <p id="email"></p>
                </div>
            </div>
        </header>

        <main class="flex flex-col gap-6">
            <div
                class="section border rounded-2xl border-white p-4 w-90 font-bold text-xl flex flex-col gap-5 justify-between hover:bg-[#55569E] hover:border-transparent hover:cursor-pointer">

                <div class="flex justify-between items-center">
                    Skills
                    <img src="assets/img/seta.png" alt="" class="max-h-3">
                </div>

                <div class="extra-content hidden gap-8 justify-center">

                    <div class="flex flex-col">
                        <h3 class="text-sm text-center font-semibold mb-3">Hard Skills</h3>
                        <div id="hardSkills" class="grid grid-cols-2 gap-4 place-items-center"></div>
                    </div>

                    <div class="text-sm flex flex-col items-center">
                        <h3 class="text-sm text-center font-semibold mb-3">Soft Skills</h3>
                        <ul id="softSkills" class="font-normal list-disc list-inside"></ul>
                    </div>

                </div>

            </div>

            <div
                class="section border rounded-2xl border-white p-4 w-90 font-bold text-xl flex flex-col gap-5 justify-between hover:bg-[#55569E] hover:border-transparent hover:cursor-pointer">

                <div class="flex justify-between items-center">
                    Idiomas
                    <img src="assets/img/seta.png" alt="" class="max-h-3">
                </div>

                <div id="idioma" class="extra-content hidden  gap-2"></div>



            </div>
            <div
                class="section border rounded-2xl border-white p-4 w-90 font-bold text-xl flex flex-col gap-5 justify-between hover:bg-[#55569E] hover:border-transparent hover:cursor-pointer">

                <div class="flex justify-between items-center">
                    Educação
                    <img src="assets/img/seta.png" alt="" class="max-h-3">
                </div>

                <div id="education" class="extra-content hidden  gap-2"></div>

            </div>

            <div
                class="section border rounded-2xl border-white p-4 w-90 font-bold text-xl flex flex-col gap-5 justify-between hover:bg-[#55569E] hover:border-transparent hover:cursor-pointer">


                <div class="flex justify-between items-center">
                    Projetos
                    <img src="assets/img/seta.png" alt="" class="max-h-3">
                </div>

                <div class="extra-content hidden gap-2">

                    <div id="projects" class="flex flex-col gap-2"></div>

                </div>

            </div>
            <div
                class="section border rounded-2xl border-white p-4 w-90 font-bold text-xl flex flex-col gap-5 justify-between hover:bg-[#55569E] hover:border-transparent hover:cursor-pointer">

                <div class="flex justify-between items-center">
                    Experiências
                    <img src="assets/img/seta.png" alt="" class="max-h-3">
                </div>

                <div id="experience" class="extra-content hidden  gap-2"></div>
            </div>
        </main>
    </div>

    <script src="assets/js/extraContent.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
